name: iOS TestFlight

# T55. Manual o al crear una etiqueta v*. Si faltan secretos, se omite sin fallar.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Número de build (vacío = siguiente libre en TestFlight)"
        required: false
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  comprobar-secretos:
    runs-on: ubuntu-latest
    outputs:
      listos: ${{ steps.check.outputs.listos }}
    steps:
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          faltan=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID \
                   IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISION_PROFILE_BASE64; do
            [ -z "${!v}" ] && faltan="$faltan $v"
          done
          if [ -n "$faltan" ]; then
            echo "listos=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight omitido: faltan secretos:$faltan (ver docs/ios-ci.md)"
          else
            echo "listos=true" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    needs: comprobar-secretos
    if: needs.comprobar-secretos.outputs.listos == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: iosApp

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Fastlane beta
        working-directory: iosApp
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: bundle exec fastlane beta
