# Proyecto Xcode generado con XcodeGen: `cd iosApp && xcodegen generate` (ver docs/ios-xcodegen.md).
# El .xcodeproj NO se versiona. Esta es la fuente de verdad.
name: FitArchive
options:
  bundleIdPrefix: app.luxion
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"       # CFBundleShortVersionString; CI puede pasar MARKETING_VERSION=x.y.z
    CURRENT_PROJECT_VERSION: "1"      # CFBundleVersion; CI puede pasar CURRENT_PROJECT_VERSION=N
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO  # Gradle necesita escribir fuera del sandbox de Xcode
targets:
  FitArchive:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.luxion.fitarchiveapp
        PRODUCT_NAME: FitArchive
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
        # Firma: sin equipo aquí; T55 la inyecta (DEVELOPMENT_TEAM, CODE_SIGN_STYLE) desde CI.
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Compilar framework Shared (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
