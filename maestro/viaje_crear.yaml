# Viajes (T37, O10): validación del formulario (fechas con DatePicker) y alta de un viaje. Parte de la lista de viajes vacía.
# Env: DESTINO (p.ej. Lisboa). Crea el viaje del 10 al 14 de diciembre de 2026 (5 días).
# Los días del selector se eligen por su descripción de accesibilidad (vale en cualquier idioma). Supone el emulador en noviembre de 2026: el selector abre en noviembre, se avanza un mes con ">".
appId: app.luxion.fitarchiveapp
---
- tapOn: "Viajes"
- assertVisible: "Aún no tienes viajes"
- tapOn: "Nuevo viaje"
- tapOn: "Guardar"
- assertVisible: "Ponle un nombre o un destino al viaje"
- tapOn: "Destino"
- inputText: "${DESTINO}"
# Vuelta sin ida
- tapOn: "Vuelta.*"
- tapOn:
    point: "85%,35%"
- tapOn: '.*\b14\b.*'
- assertVisible: "14 dic 2026"
- tapOn: "Aceptar"
- assertVisible: "Vuelta 14 dic 2026"
- tapOn: "Guardar"
- assertVisible: "Indica también la fecha de inicio"
# Vuelta anterior a la ida
- tapOn: "Ida.*"
- tapOn:
    point: "85%,35%"
- tapOn: '.*\b20\b.*'
- tapOn: "Aceptar"
- tapOn: "Guardar"
- assertVisible: "La vuelta no puede ser antes de la ida"
# Se corrige la ida (el selector abre en el mes de la fecha ya elegida)
- tapOn: "Ida.*"
- tapOn: '.*\b10\b.*'
- tapOn: "Aceptar"
- tapOn: "Guardar"
# Al crearlo se abre el detalle
- assertVisible: "${DESTINO}"
- assertVisible: "10 dic → 14 dic 2026 · 5 días"
- assertVisible: "La maleta está vacía.*"
