# Añade una prenda desde la galería. Parte del armario (vacío o no).
# Env: FOTO_X (punto horizontal del selector, p.ej. 16%), TIPO, ESTACION, USO
appId: app.luxion.fitarchiveapp
---
- tapOn:
    text: "Añadir mi primera prenda|[+] Añadir"
- tapOn: "Elegir de la galería"
- waitForAnimationToEnd
- tapOn:
    point: "${FOTO_X},62%"
- tapOn: "Done"
# Esperar al formulario (la primera vez ML Kit puede tardar en descargar el modelo)
- extendedWaitUntil:
    visible: "Guardar prenda|Tipo.*"
    timeout: 60000
- tapOn: "${TIPO}"
- scrollUntilVisible:
    element: "${ESTACION}"
- tapOn: "${ESTACION}"
- scrollUntilVisible:
    element: "${USO}"
- tapOn: "${USO}"
- scrollUntilVisible:
    element: "Guardar prenda"
- tapOn: "Guardar prenda"
- extendedWaitUntil:
    visible: "Armario"
    timeout: 10000
