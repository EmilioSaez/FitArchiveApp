# T44: sin red el tiempo falla: aviso "No pudimos consultar el tiempo", sugerencia sin clima y "Reintentar" que recupera el tiempo al volver la red.
# Antes: adb shell svc wifi disable; adb shell svc data disable. Después, reactivar la red y ejecutar hoy_reintentar.
appId: app.luxion.fitarchiveapp
---
- launchApp:
    stopApp: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Calendario"
    timeout: 8000
- waitForAnimationToEnd
- tapOn: "Hoy"
- extendedWaitUntil:
    visible: "No pudimos consultar el tiempo.*"
    timeout: 30000
- assertVisible: "Reintentar"
- assertNotVisible: "[0-9-]+° · máx.*"
- assertNotVisible: "Clima"
- assertVisible: "[0-9]+%"
