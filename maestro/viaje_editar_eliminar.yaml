# Viajes (T37): editar un viaje, volver a la lista, cancelar y confirmar la eliminación.
# Env: DESTINO (viaje existente del 10 al 14 dic 2026), NUEVO (nuevo nombre). Borra la vuelta (queda solo la ida) y la pone al 12 dic (3 días).
appId: app.luxion.fitarchiveapp
---
- tapOn: "Viajes"
- tapOn: "${DESTINO}"
- tapOn: "Editar"
- assertVisible: "Editar viaje"
# Se toca a la derecha del texto para que el cursor quede al final y eraseText borre el valor entero
- tapOn:
    point: "80%,37%"
- eraseText: 40
- inputText: "${NUEVO}"
- tapOn: "Borrar vuelta"
- tapOn: "Guardar"
- assertVisible: "${NUEVO}"
- assertVisible: "10 dic 2026"
- tapOn: "Editar"
- tapOn: "Vuelta.*"
- tapOn: '.*\b12\b.*'
- tapOn: "Aceptar"
- tapOn: "Guardar"
- assertVisible: "10 dic → 12 dic 2026 · 3 días"
- tapOn: "‹ Viajes"
- assertVisible: "${NUEVO}"
- tapOn: "${NUEVO}"
- tapOn: "Eliminar"
- tapOn: "Cancelar"
- assertVisible: "${NUEVO}"
- tapOn: "Eliminar"
- tapOn:
    point: "74%,56%"
- assertVisible: "Aún no tienes viajes"
