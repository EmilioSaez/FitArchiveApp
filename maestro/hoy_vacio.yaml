# T44: armario vacío en Hoy: mensaje, tiempo y ocasiones visibles, sin acciones, y "Añadir prenda" lleva a añadir. Borra los datos (ejecutar el último).
appId: app.luxion.fitarchiveapp
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Calendario"
    timeout: 8000
- waitForAnimationToEnd
- tapOn: "Hoy"
- extendedWaitUntil:
    visible: "Tu armario está vacío"
    timeout: 15000
- assertVisible: "Añade prendas para que te sugiramos qué ponerte."
- assertNotVisible: "Aceptar para hoy"
- assertNotVisible: "Regenerar"
- tapOn: "Añadir prenda"
- assertVisible: "Elegir de la galería|Cámara|Nueva prenda"
