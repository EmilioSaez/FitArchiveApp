# T44: "Guardar como outfit" guarda la sugerencia en Outfits sin asignarla a hoy y no la duplica. Env: NOMBRE.
appId: app.luxion.fitarchiveapp
---
- launchApp
- extendedWaitUntil:
    visible: "Calendario"
    timeout: 8000
- waitForAnimationToEnd
- tapOn: "Hoy"
- extendedWaitUntil:
    visible: "Alternativas"
    timeout: 15000
- scrollUntilVisible:
    element: "Guardar como outfit|Guardado en tus outfits"
- tapOn: "Guardar como outfit"
- extendedWaitUntil:
    visible: "Guardado en tus outfits"
    timeout: 5000
- assertVisible: "Outfit guardado"
- assertVisible: "Aceptar para hoy"
- tapOn: "Outfits"
- assertVisible: "${NOMBRE}"
